<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ISM 145 Leave Tracker</title>
<style>
:root{--navy:#17365d;--blue:#2f75b5;--pale:#eef5fb;--green:#087f5b;--text:#1f2937;--muted:#667085;--line:#dbe4ee;--white:#fff;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Aptos,Arial,sans-serif;background:linear-gradient(145deg,#e8f1f8,#f8fafc 58%,#eaf4f0);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(760px,100%)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.mark{width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,var(--navy),var(--blue));display:grid;place-items:center;color:white;font-weight:800;font-size:18px;box-shadow:0 12px 30px #17365d33}.brand h1{margin:0;color:var(--navy);font-size:clamp(23px,4vw,34px)}.brand p{margin:4px 0 0;color:var(--muted)}.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,42px);box-shadow:0 22px 65px #17365d1c}.status{display:flex;align-items:center;gap:9px;color:var(--green);font-weight:700;margin-bottom:22px}.dot{width:10px;height:10px;border-radius:50%;background:#12b886;box-shadow:0 0 0 5px #12b8861f}.label{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}.host{font-size:24px;font-weight:750;color:var(--navy);margin:5px 0 5px}.address{font-family:Consolas,monospace;padding:11px 13px;border-radius:10px;background:var(--pale);overflow-wrap:anywhere;color:#24527a}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.btn{appearance:none;border:0;border-radius:11px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white;box-shadow:0 8px 20px #2f75b540}.secondary{background:#edf2f7;color:var(--navy);border:1px solid var(--line)}.btn:focus-visible{outline:3px solid #90cdf4;outline-offset:3px}.note{margin-top:24px;padding:14px 16px;border-left:4px solid #f0ad4e;background:#fff8e6;border-radius:8px;font-size:14px;color:#6d5100}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:25px;padding-top:16px;color:var(--muted);font-size:13px}.error{color:#b42318;background:#fff1f0;border:1px solid #ffc9c5;border-radius:10px;padding:12px;margin-top:16px;display:none}@media(max-width:520px){.actions .btn{width:100%}}
</style>
</head>
<body>
<main class="shell">
  <header class="brand"><div class="mark">ISM</div><div><h1>ISM 145 Leave Tracker</h1><p>Team access launcher</p></div></header>
  <section class="card">
    <div class="status"><span class="dot"></span><span>Active host configured</span></div>
    <div class="label">Current active server</div>
    <div class="host" id="hostName">Loading...</div>
    <div class="address" id="hostUrl">Please wait</div>
    <div class="actions">
      <button class="btn primary" id="openBtn" type="button">Open Leave Tracker</button>
      <button class="btn secondary" id="copyBtn" type="button">Copy direct link</button>
    </div>
    <div class="error" id="errorBox" role="alert"></div>
    <div class="note"><b>Office access:</b> The tracker opens only when the selected host laptop is on, the Python server is running, and the user’s device can reach the host on the office network.</div>
    <div class="meta"><span id="updatedBy"></span><span id="updatedAt"></span></div>
  </section>
</main>
<script src="config.js"></script>
<script>
(function(){
  const c=window.TRACKER_CONFIG||{};
  const key=c.activeHost;
  const host=c[key];
  const error=document.getElementById('errorBox');
  function showError(message){error.textContent=message;error.style.display='block'}
  if(!host||!host.url){showError('The active host is not configured. Please contact a TL.');return}
  document.getElementById('hostName').textContent=host.name||key;
  document.getElementById('hostUrl').textContent=host.url;
  document.getElementById('updatedBy').textContent='Updated by: '+(c.updatedBy||'Not recorded');
  document.getElementById('updatedAt').textContent='Updated: '+(c.updatedAt||'Not recorded');
  document.getElementById('openBtn').addEventListener('click',()=>{window.location.href=host.url});
  document.getElementById('copyBtn').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(host.url);document.getElementById('copyBtn').textContent='Link copied'}
    catch(e){showError('Copy was blocked. Select and copy the direct link shown above.')}
  });
})();
</script>
</body>
</html>
