<script>

const sb=cloudReady?supabase.createClient(cloudConfig.supabaseUrl,cloudConfig.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const TLS=[{name:'Kirtan Shetty',email:'Kirtan.Shetty@morningstar.com'},{name:'Aman Singh',email:'Aman.Singh@morningstar.com'}];
const EMP=[['A001','Aishwarya Rindhe','Aishwarya.Rindhe@morningstar.com','Aman.Singh@morningstar.com'],['A002','Arika Halder','ArikaHalder.Arika@morningstar.com','Aman.Singh@morningstar.com'],['A003','Disha Dorugade','Disha.Dorugade@morningstar.com','Aman.Singh@morningstar.com'],['A004','Lisha Porwal','Lisha.Porwal@morningstar.com','Aman.Singh@morningstar.com'],['A005','Shreya Pednekar','Shreya.Pednekar1@morningstar.com','Aman.Singh@morningstar.com'],['A006','Ricky Chettiar','Ricky.Chettiar@morningstar.com','Aman.Singh@morningstar.com'],['A007','Pranav Jagtap','Pranav.Jagtap@morningstar.com','Aman.Singh@morningstar.com'],['K001','Bushra Sayyed','Bushra.Sayyed@morningstar.com','Kirtan.Shetty@morningstar.com'],['K002','Danish Azmi','Danish.Azmi@morningstar.com','Kirtan.Shetty@morningstar.com'],['K003','Janhvi More','JANHVI.MORE@Morningstar.com','Kirtan.Shetty@morningstar.com'],['K004','Kaushal Sawant','Kaushal.Sawant@morningstar.com','Kirtan.Shetty@morningstar.com'],['K005','Nishant Poojary','Nishant.Poojary@morningstar.com','Kirtan.Shetty@morningstar.com'],['K006','Shubham Tejani','Shubham.Tejani@morningstar.com','Kirtan.Shetty@morningstar.com'],['K007','Sonali Kshirsagar','Sonali.Kshirsagar@morningstar.com','Kirtan.Shetty@morningstar.com']].map(x=>({id:x[0],name:x[1],email:x[2],tl:x[3],cl:12,el:12}));
const TYPES=['Casual Leave','Earned Leave','Maternity Leave','Sabbatical Leave','Comp-Off Leave','Indian Legacy Comp-Off Leave','Work From Home','Work From Anywhere'];
const FIXED_ALLOWANCES={'Casual Leave':14,'Maternity Leave':182};

function ownTeam(tlEmail=state.email){return state.role==='tl'?EMP:EMP.filter(e=>e.tl.toLowerCase()===tlEmail.toLowerCase())}
function activeCoverageFor(backupEmail){let k=today();return TLS.map(t=>tlCoverage[t.email.toLowerCase()]).filter(c=>c&&c.backupEmail.toLowerCase()===backupEmail.toLowerCase()&&c.enabled&&k>=c.from&&k<=c.to)}
function allowanceFor(employeeId,type){if(type in FIXED_ALLOWANCES)return FIXED_ALLOWANCES[type];return Number(allowances[employeeId]?.[type]||0)}
function saveAllowances(){sharedSave()}
let state={role:'employee',email:'JANHVI.MORE@Morningstar.com',page:'dashboard',year:new Date().getFullYear(),plannerMonth:new Date().getMonth()};
let requests=[]; let sharedVersion=0; let apiToken=sessionStorage.getItem('ism145.api.token')||'';
// One-time cleanup requested by Janhvi: remove rejected trial records only.
if(!localStorage.getItem('ism145.cleanup.janhviRejected.v1')){
  requests=requests.filter(r=>!(String(r.employeeName||'').toLowerCase()==='janhvi more'&&r.status==='Rejected'));
  localStorage.setItem('ism145.html.requests',JSON.stringify(requests));
  localStorage.setItem('ism145.cleanup.janhviRejected.v1',new Date().toISOString());
}
let rules=JSON.parse(localStorage.getItem('ism145.html.rules')||'null')||{enabled:true,firstAfter:1,repeatEvery:2,urgentAfter:5,browserAlerts:false};
const save=()=>sharedSave();
const me=()=>state.role==='tl'?TLS.find(x=>x.email.toLowerCase()===state.email.toLowerCase()):EMP.find(x=>x.email.toLowerCase()===state.email.toLowerCase());
const team=()=>state.role==='tl'?EMP:EMP.filter(x=>x.email.toLowerCase()===state.email.toLowerCase());
const visible=()=>{let ids=new Set(team().map(x=>x.id));return requests.filter(x=>ids.has(x.employeeId))};
const today=()=>new Date().toISOString().slice(0,10),pretty=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),age=r=>Math.max(0,Math.floor((Date.now()-new Date(r.createdAt||Date.now()))/86400000));
function workdays(a,b){if(!a||!b||b<a)return 0;let d=new Date(a+'T00:00:00'),e=new Date(b+'T00:00:00'),n=0;while(d<=e){if(![0,6].includes(d.getDay()))n++;d.setDate(d.getDate()+1)}return n}
function flash(t){let n=document.getElementById('notice');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',3000)}
function goto(p){state.page=p;render()}
function options(list){return list.map(x=>`<option value="${x.email}" ${x.email.toLowerCase()===state.email.toLowerCase()?'selected':''}>${x.name}</option>`).join('')}
function render(){let who=me();document.getElementById('signedLabel').textContent=`${state.role==='tl'?'TL':'Employee'} Dashboard · Signed in as ${who.name}`;let nav=[['dashboard','Dashboard'],['planner','Monthly Team Planner'],['calendar',state.role==='tl'?'Team Calendar':'My Calendar'],...(state.role==='employee'?[['new','New Request']]:[]),['requests',state.role==='tl'?'Team Requests':'My Requests'],...(state.role==='tl'?[['balances','Leave Balances'],['historical','Add Past Leaves'],['reminders','Reply Reminders']]:[])];let due=countDue();document.getElementById('nav').innerHTML=nav.map(x=>`<button class="nav ${state.page===x[0]?'active':''}" onclick="goto('${x[0]}')">${x[1]}${x[0]==='reminders'&&due?` <span class="pill">${due}</span>`:''}</button>`).join('')+`<div class="privacy">${state.role==='tl'?team().length+' employees visible to both TLs':'Only your own records are visible'}</div>`;if(state.page==='account')accountPage();if(state.page==='planner')monthlyPlanner();if(state.page==='dashboard')dashboard();if(state.page==='calendar')calendarView();if(state.page==='new')newRequest();if(state.page==='requests')requestTable();if(state.page==='balances')balanceManager();if(state.page==='historical')historicalEntry();if(state.page==='reminders')reminders()}
function used(id,type){return requests.filter(x=>x.employeeId===id&&x.type===type&&x.status==='Approved').reduce((s,x)=>s+x.days,0)}
function stat(l,v){return `<div class="card stat"><label>${l}</label><strong>${v}</strong></div>`}
function dashboard(){let v=visible(),who=me();if(state.role==='employee'){document.getElementById('main').innerHTML=`<section class="grid stats">${stat('Casual leave balance',allowanceFor(who.id,'Casual Leave')-used(who.id,'Casual Leave'))}${stat('Earned leave balance',allowanceFor(who.id,'Earned Leave')-used(who.id,'Earned Leave'))}${stat('Maternity leave balance',allowanceFor(who.id,'Maternity Leave')-used(who.id,'Maternity Leave'))}${stat('Pending requests',v.filter(x=>x.status==='Pending').length)}${stat('Approved requests',v.filter(x=>x.status==='Approved').length)}</section>`;return}let pending=v.filter(x=>x.status==='Pending');document.getElementById('main').innerHTML=`<div class="coverage-banner coverage-ok" style="margin-bottom:16px"><b>Shared TL administration:</b> Kirtan Shetty and Aman Singh can both view and action requests for all ${team().length} employees. The original reporting TL is still used for Outlook email routing.</div><section class="grid stats">${stat('Employees',team().length)}${stat('Pending replies',pending.length)}${stat('Approved',v.filter(x=>x.status==='Approved').length)}${stat('Currently away',v.filter(x=>x.status==='Approved'&&today()>=x.start&&today()<=x.end).length)}</section>${chart()}<section class="card"><div class="section-title"><div><h2>All employees overview</h2><p>Leave balances and current availability</p></div></div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Reporting TL</th><th>Email</th><th>CL used</th><th>EL used</th><th>Pending</th><th>Availability</th></tr></thead><tbody>${team().map(e=>`<tr><td><b>${e.name}</b></td><td>${TLS.find(t=>t.email.toLowerCase()===e.tl.toLowerCase()).name}</td><td>${e.email}</td><td>${used(e.id,'Casual Leave')} / ${allowanceFor(e.id,'Casual Leave')}</td><td>${used(e.id,'Earned Leave')} / ${allowanceFor(e.id,'Earned Leave')}</td><td>${v.filter(x=>x.employeeId===e.id&&x.status==='Pending').length}</td><td>${v.some(x=>x.employeeId===e.id&&x.status==='Approved'&&today()>=x.start&&today()<=x.end)?'Away':'Available'}</td></tr>`).join('')}</tbody></table></div></section>`}
function chart(){let yr=new Date().getFullYear(),v=visible(),rows=team().map(e=>{let r=v.filter(x=>x.employeeId===e.id&&x.status==='Approved'&&x.start.startsWith(yr)),leave=r.filter(x=>x.type.includes('Leave')).reduce((s,x)=>s+x.days,0),flex=r.filter(x=>!x.type.includes('Leave')).reduce((s,x)=>s+x.days,0);return{...e,leave,flex,total:leave+flex}}).sort((a,b)=>b.total-a.total),max=Math.max(1,...rows.map(x=>x.total));return `<section class="card" style="margin-top:16px"><div class="section-title"><div><h2>All employees utilization chart</h2><p>Approved leave and flexible-work days in ${yr}</p></div></div>${rows.map(x=>`<div class="barrow"><span>${x.name}</span><div class="bar"><i class="leavebar" style="width:${x.leave/max*100}%"></i><i class="flexbar" style="width:${x.flex/max*100}%"></i></div><span><b>${x.total}</b> days</span></div>`).join('')}<div class="legend">● Leave &nbsp;&nbsp; <span style="color:#38bdf8">●</span> WFH / WFA</div></section>`}



function coveragePage(){if(state.role!=='tl')return goto('dashboard');let self=me(),other=TLS.find(t=>t.email.toLowerCase()!==self.email.toLowerCase()),mine=tlCoverage[self.email.toLowerCase()]||{enabled:false,from:today(),to:today(),backupEmail:other.email,note:''},incoming=activeCoverageFor(self.email),incomingHtml=incoming.map(c=>{let absent=TLS.find(t=>t.email.toLowerCase()===c.ownerEmail.toLowerCase()),members=ownTeam(c.ownerEmail),ids=new Set(members.map(e=>e.id)),r=requests.filter(x=>ids.has(x.employeeId));return `<section class="card" style="margin-top:16px"><div class="section-title"><div><h2>Backup view: ${absent.name}'s team</h2><p>Coverage active ${pretty(c.from)} to ${pretty(c.to)}${c.note?' · '+c.note:''}</p></div></div><div class="readonly">Read-only access: team details and requests are visible, but approvals, rejections, historical imports, deletions and balance edits remain restricted to the employee's reporting TL.</div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Employee</th><th>Reporting TL</th><th>Email</th><th>CL used</th><th>EL used</th><th>Pending</th><th>Availability</th></tr></thead><tbody>${members.map(e=>`<tr><td><b>${e.name}</b></td><td>${TLS.find(t=>t.email.toLowerCase()===e.tl.toLowerCase()).name}</td><td>${e.email}</td><td>${used(e.id,'Casual Leave')} / ${allowanceFor(e.id,'Casual Leave')}</td><td>${used(e.id,'Earned Leave')} / ${allowanceFor(e.id,'Earned Leave')}</td><td>${r.filter(x=>x.employeeId===e.id&&x.status==='Pending').length}</td><td>${r.some(x=>x.employeeId===e.id&&x.status==='Approved'&&today()>=x.start&&today()<=x.end)?'Away':'Available'}</td></tr>`).join('')}</tbody></table></div><h3 style="margin-top:22px">All Employee Requests</h3><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Request</th><th>Dates</th><th>Days</th><th>Status</th><th>Details</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x.employeeName}</td><td>${x.type}</td><td>${pretty(x.start)}${x.end!==x.start?' – '+pretty(x. const PLANNER_CODES={'Casual Leave':{code:'CL',cls:'code-cl',deduct:1},'Earned Leave':{code:'EL',cls:'code-el',deduct:1},'Maternity Leave':{code:'ML',cls:'code-ml',deduct:1},'Sabbatical Leave':{code:'SL',cls:'code-sl',deduct:1},'Comp-Off Leave':{code:'CO',cls:'code-co',deduct:1},'Indian Legacy Comp-Off Leave':{code:'IL',cls:'code-il',deduct:1},'Work From Home':{code:'WH',cls:'code-wh',deduct:0},'Work From Anywhere':{code:'WA',cls:'code-wa',deduct:0}};
function monthKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function isoWeek(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let start=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-start)/86400000)+1)/7)}
function plannerCodeFor(employeeId,k){let hits=visible().filter(r=>r.employeeId===employeeId&&r.status!=='Rejected'&&k>=r.start&&k<=r.end);if(!hits.length)return null;let r=hits[0],base=PLANNER_CODES[r.type]||{code:'L',cls:'code-cl',deduct:1};if(r.duration==='Half Day')return{code:'HD',cls:'code-hd',deduct:.5,title:`${r.type} · Half Day · ${r.status}`};return{...base,title:`${r.type} · ${r.status}`}}
function monthlyPlanner(){let year=state.year,month=state.plannerMonth,first=new Date(year,month,1),count=new Date(year,month+1,0).getDate(),people=team(),daysArr=Array.from({length:count},(_,i)=>i+1),groups=[];daysArr.forEach(d=>{let w=isoWeek(new Date(year,month,d)),g=groups.find(x=>x.w===w);if(g)g.n++;else groups.push({w,n:1})});let rows=people.map(e=>{let total=0,cells=daysArr.map(d=>{let date=new Date(year,month,d),k=monthKey(year,month,d),x=plannerCodeFor(e.id,k),weekend=[0,6].includes(date.getDay());if(x)total+=x.deduct;return `<td class="${weekend?'weekend ':''}${x?x.cls:''}" title="${x?x.title:''}">${x?`<span class="code">${x.code}</span>`:''}</td>`}).join('');return `<tr><td class="name">${e.name}</td>${cells}<td class="total">${total}</td></tr>`}).join('');let legends=Object.entries(PLANNER_CODES).map(([name,x])=>`<div class="legend-item"><span>${name}</span><span class="legend-code ${x.cls}">${x.code}</span><span>${x.deduct}</span></div>`).join('')+`<div class="legend-item"><span>Half Day</span><span class="legend-code code-hd">HD</span><span>0.5</span></div>`;document.getElementById('main').innerHTML=`<section class="card"><div class="calendar-head"><div><h2 style="margin:0">${state.role==='tl'?'All Employees':'My'} Monthly Attendance Planner</h2><p class="small">Spreadsheet-style view generated automatically from non-rejected tracker requests.</p></div><div><button class="btn" onclick="changePlannerMonth(-1)">‹</button> <b style="padding:0 12px">${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b> <button class="btn" onclick="changePlannerMonth(1)">›</button></div></div></section><section class="card" style="margin-top:16px"><div class="planner-wrap"><table class="planner"><thead><tr><th class="name" rowspan="2">Employee</th>${groups.map(g=>`<th class="weekhead" colspan="${g.n}">Week ${g.w}</th>`).join('')}<th rowspan="2">Absences<br>this month</th></tr><tr>${daysArr.map(d=>{let dt=new Date(year,month,d);return `<th>${dt.toLocaleDateString('en-US',{month:'short'})}<br>${d}<br>${dt.toLocaleDateString('en-US',{weekday:'short'})}</th>`}).join('')}</tr></thead><tbody>${rows}</tbody></table></div></section><section class="card" style="margin-top:16px"><div class="section-title"><div><h2>Absence type legend</h2><p>Deduction shows the monthly absence total contribution. WFH and WFA are displayed but not deducted.</p></div></div><div class="planner-legend">${legends}</div></section>`}
function changePlannerMonth(n){state.plannerMonth+=n;if(state.plannerMonth<0){state.plannerMonth=11;state.year--}if(state.plannerMonth>11){state.plannerMonth=0;state.year++}monthlyPlanner()}

function typeClass(t){return t==='Casual Leave'?'dot-cl':t==='Earned Leave'?'dot-el':t==='Maternity Leave'?'dot-ml':t==='Sabbatical Leave'?'dot-sabbatical':t==='Comp-Off Leave'?'dot-compoff':t==='Indian Legacy Comp-Off Leave'?'dot-legacy':t==='Work From Home'?'dot-wfh':'dot-wfa'}
function calendarView(){let year=state.year,v=visible().filter(x=>x.status!=='Rejected'&&(Number(x.start.slice(0,4))<=year&&Number(x.end.slice(0,4))>=year));let months=Array.from({length:12},(_,m)=>monthHtml(year,m,v)).join('');document.getElementById('main').innerHTML=`<section class="card"><div class="calendar-head"><div><h2 style="margin:0">${state.role==='tl'?'All Employees':'My'} annual leave calendar</h2><p class="small">Approved, pending and draft requests are shown. Rejected requests are excluded.</p></div><div><button class="btn" onclick="changeYear(-1)">‹</button> <b style="padding:0 12px">${year}</b> <button class="btn" onclick="changeYear(1)">›</button></div></div><div class="legend-row" style="margin-top:14px"><span><i class="dot dot-cl" style="display:inline-block"></i> Casual Leave</span><span><i class="dot dot-el" style="display:inline-block"></i> Earned Leave</span><span><i class="dot dot-ml" style="display:inline-block"></i> Maternity Leave</span><span><i class="dot dot-sabbatical" style="display:inline-block"></i> Sabbatical Leave</span><span><i class="dot dot-compoff" style="display:inline-block"></i> Comp-Off Leave</span><span><i class="dot dot-legacy" style="display:inline-block"></i> Indian Legacy Comp-Off Leave</span><span><i class="dot dot-wfh" style="display:inline-block"></i> WFH</span><span><i class="dot dot-wfa" style="display:inline-block"></i> WFA</span></div></section><section class="calendar-grid" style="margin-top:16px">${months}</section><section class="card" style="margin-top:16px"><div class="section-title"><div><h2>Requests in ${year}</h2><p>${v.length} visible request(s)</p></div></div><div class="calendar-list">${v.map(x=>`<div class="event-card"><b>${state.role==='tl'?x.employeeName+' · ':''}${x.type}</b><div class="small">${pretty(x.start)}${x.end!==x.start?' – '+pretty(x.end):''} · ${x.status}</div><div class="small">${x.compWfoDate?'Compensatory WFO: '+pretty(x.compWfoDate):x.wfaLocation?'Location: '+x.wfaLocation:x.reason}</div></div>`).join('')||'<div class="empty">No requests recorded for this year.</div>'}</div></section>`}
function monthHtml(year,month,v){let first=new Date(year,month,1),offset=(first.getDay()+6)%7,count=new Date(year,month+1,0).getDate(),cells=Array(offset).fill(null).concat(Array.from({length:count},(_,i)=>i+1));return `<div class="month"><h3>${first.toLocaleDateString('en-IN',{month:'long'})}</h3><div class="week">${['M','T','W','T','F','S','S'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="dates">${cells.map((d,i)=>{if(!d)return '<div class="day"></div>';let k=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),hits=v.filter(x=>k>=x.start&&k<=x.end),tip=hits.map(x=>(state.role==='tl'?x.employeeName+': ':'')+x.type).join(' | ');return `<div class="day ${hits.length?'has':''}" title="${tip.replace(/"/g,'&quot;')}"><span>${d}</span><div class="dots">${hits.slice(0,4).map(x=>`<i class="dot ${typeClass(x.type)}"></i>`).join('')}</div></div>`}).join('')}</div></div>`}

function newRequest(){let who=me(),p=TLS.find(x=>x.email.toLowerCase()===who.tl.toLowerCase()),o=TLS.find(x=>x.email.toLowerCase()!==who.tl.toLowerCase());document.getElementById('main').innerHTML=`<section class="grid two"><div class="card"><div class="section-title"><div><h2>Create request</h2><p>Complete the details and open a reviewable Outlook draft</p></div></div><div class="formgrid"><label>Request type<select id="type" class="field" onchange="conditional()">${TYPES.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Day type<select id="duration" class="field" onchange="durationChanged()"><option>Full Day</option><option>Half Day</option></select></label><label>From<input id="start" type="date" class="field" value="${today()}"></label><label>To<input id="end" type="date" class="field" value="${today()}"></label><div id="extra" class="full"></div><label class="full">Reason<textarea id="reason" class="field" rows="4"></textarea></label><label class="full">Handover / coverage<textarea id="handover" class="field" rows="3"></textarea></label></div><div style="margin-top:18px;display:flex;gap:8px"><button class="btn" onclick="submitRequest(true)">Save draft</button><button class="btn primary" onclick="submitRequest(false)">Submit & open Outlook draft</button></div></div><div class="card"><h2>Email routing</h2><div class="route"><b>To:</b> ${p.email}<br><b>CC:</b> ${o.email}</div><p class="small">The draft opens in the configured email application. The employee's reporting TL remains in To and the other TL remains in CC; both TLs can administer the request in the tracker.</p></div></section>`}

function submitRequest(draft){let who=me(),type=document.getElementById('type').value,duration=document.getElementById('duration').value,start=document.getElementById('start').value,end=duration==='Half Day'?start:document.getElementById('end').value,reason=document.getElementById('reason').value.trim(),handover=document.getElementById('handover').value.trim(),comp=document.getElementById('comp')?.value||'',loc=document.getElementById('location')?.value.trim()||'',n=duration==='Half Day'?.5:workdays(start,end);if(!reason||n<=0)return flash('Add valid dates and a reason.');if(type==='Work From Home'&&!comp)return flash('Add the compensatory WFO date.');if(type==='Work From Anywhere'&&!loc)return flash('Add the WFA location.');let p=TLS.find(x=>x.email.toLowerCase()===who.tl.toLowerCase()),o=TLS.find(x=>x.email.toLowerCase()!==who.tl.toLowerCase()),r={id:Date.now(),employeeId:who.id,employeeName:who.name,employeeEmail:who.email,type,duration,start,end,reason,handover,compWfoDate:comp,wfaLocation:loc,days:n,status:draft?'Draft':'Pending',createdAt:new Date().toISOString(),to:p.email,cc:o.email};requests.unshift(r);save();flash(draft?'Draft saved.':'Request saved and email draft opened.');if(!draft){let body=`Hi ${p.name},\n\nI would like to request ${type} from ${pretty(start)} to ${pretty(end)}.\n${comp?`Compensatory WFO date: ${pretty(comp)}\n`:''}${loc?`Work From Anywhere location: ${loc}\n`:''}\nReason: ${reason}\n${handover?`Handover: ${handover}\n`:''}\nRegards,\n${who.name}`;location.href=`mailto:${p.email}?cc=${encodeURIComponent(o.email)}&subject=${encodeURIComponent(type+' request | '+who.name)}&body=${encodeURIComponent(body)}`}}

function historicalEntry(){if(state.role!=='tl')return goto('dashboard');document.getElementById('main').innerHTML=`<section class="grid two"><div class="card"><div class="section-title"><div><h2>Add one past leave</h2><p>Records are saved as Approved and update balances, utilization and calendar immediately.</p></div></div><div class="formgrid"><label>Employee<select id="histEmp" class="field">${team().map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select></label><label>Request type<select id="histType" class="field" onchange="histConditional()">${TYPES.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Day type<select id="histDuration" class="field" onchange="histDurationChanged()"><option>Full Day</option><option>Half Day</option></select></label><label>Status<select id="histStatus" class="field"><option>Approved</option><option>Pending</option><option>Rejected</option></select></label><label>From<input id="histStart" type="date" class="field" value="${today()}"></label><label>To<input id="histEnd" type="date" class="field" value="${today()}"></label><div id="histExtra" class="full"></div><label class="full">Reason / note<textarea id="histReason" class="field" rows="3" placeholder="Historical record imported by TL"></textarea></label></div><button class="btn primary" style="margin-top:18px" onclick="saveHistorical()">Add historical record</button></div><div class="card"><div class="section-title"><div><h2>Bulk CSV import</h2><p>Best for many completed leaves.</p></div></div><p class="small">Required columns: <b>EmployeeEmail, Type, StartDate, EndDate, DayType, Status, Reason</b></p><p class="small">Use dates in YYYY-MM-DD format. Valid types: Casual Leave, Earned Leave, Maternity Leave, Sabbatical Leave, Comp-Off Leave, Indian Legacy Comp-Off Leave, Work From Home, Work From Anywhere. DayType can be Full Day or Half Day.</p><button class="btn" onclick="downloadTemplate()">Download CSV template</button><div style="margin-top:16px"><input id="csvFile" type="file" accept=".csv,text/csv" class="field" style="width:100%"></div><button class="btn primary" style="margin-top:12px" onclick="importCSV()">Import CSV</button><div id="importResult" class="small" style="margin-top:12px"></div></div></section>`}
function histConditional(){let t=document.getElementById('histType').value,e=document.getElementById('histExtra');e.innerHTML=t==='Work From Home'?`<label>Compensatory WFO date<input id="histComp" type="date" class="field"></label>`:t==='Work From Anywhere'?`<label>WFA location<input id="histLoc" class="field"></label>`:'';if(t==='Maternity Leave'){document.getElementById('histDuration').value='Full Day';document.getElementById('histDuration').disabled=true}else document.getElementById('histDuration').disabled=false}

function csvEscape(v){return '"'+String(v).replaceAll('"','""')+'"'}
function downloadTemplate(){let head=['EmployeeEmail','Type','StartDate','EndDate','DayType','Status','Reason'],sample=[team()[0].email,'Casual Leave',new Date().getFullYear()+'-01-15',new Date().getFullYear()+'-01-15','Full Day','Approved','Historical leave'];let csv=[head,sample].map(r=>r.map(csvEscape).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ISM_145_Historical_Leave_Template.csv';a.click();URL.revokeObjectURL(a.href)}
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.trim());if(row.some(Boolean))rows.push(row);return rows}
function importCSV(){let f=document.getElementById('csvFile').files[0];if(!f)return flash('Choose a CSV file first.');let reader=new FileReader();reader.onload=()=>{let rows=parseCSV(reader.result);if(rows.length<2)return flash('CSV has no data rows.');let h=rows[0].map(x=>x.toLowerCase().replace(/\s/g,'')),idx=n=>h.indexOf(n.toLowerCase()),ok=0,errors=[];rows.slice(1).forEach((r,i)=>{let email=(r[idx('EmployeeEmail')]||'').toLowerCase(),e=EMP.find(x=>x.email.toLowerCase()===email),type=r[idx('Type')],start=r[idx('StartDate')],end=r[idx('EndDate')]||start,duration=r[idx('DayType')]||'Full Day',status=r[idx('Status')]||'Approved',reason=r[idx('Reason')]||'Historical import';if(!e||!team().some(x=>x.id===e.id)){errors.push(`Row ${i+2}: employee is not in all employees`);return}if(!TYPES.includes(type)||!start||!end){errors.push(`Row ${i+2}: invalid type or dates`);return}let n=duration==='Half Day'?.5:workdays(start,end);if(n<=0){errors.push(`Row ${i+2}: invalid date range`);return}let p=TLS.find(x=>x.email.toLowerCase()===e.tl.toLowerCase()),o=TLS.find(x=>x.email.toLowerCase()!==e.tl.toLowerCase());requests.unshift({id:Date.now()+i,employeeId:e.id,employeeName:e.name,employeeEmail:e.email,type,duration,start,end,reason,days:n,status:['Approved','Pending','Rejected'].includes(status)?status:'Approved',createdAt:new Date(start+'T09:00:00').toISOString(),historical:true,to:p.email,cc:o.email});ok++});save();document.getElementById('importResult').innerHTML=`<b>${ok}</b> record(s) imported.${errors.length?'<br>'+errors.slice(0,8).join('<br>'):''}`;flash(`${ok} historical record(s) imported.`)};reader.readAsText(f)}


function balanceManager(){if(state.role!=='tl')return goto('dashboard');let rows=team().map(e=>`<tr><td><b>${e.name}</b><div class="small">${e.email}</div></td><td><b>14</b><div class="small">Fixed · Used ${used(e.id,'Casual Leave')}</div></td><td><b>182</b><div class="small">Fixed · Used ${used(e.id,'Maternity Leave')}</div></td>${EDITABLE_ALLOWANCES.map(t=>`<td><input class="field" style="width:90px" type="number" min="0" step="0.5" id="bal_${e.id}_${slug(t)}" value="${allowanceFor(e.id,t)}"><div class="small">Used ${used(e.id,t)}</div></td>`).join('')}<td><button class="btn primary" onclick="saveEmployeeBalances('${e.id}')">Save</button></td></tr>`).join('');let audit=allowanceAudit.filter(a=>team().some(e=>e.id===a.employeeId)).slice(0,30);document.getElementById('main').innerHTML=`<section class="card"><div class="section-title"><div><h2>Leave Balance Management</h2><p>Casual Leave is fixed at 14 days and Maternity Leave at 182 days. TLs can edit only tenure-dependent balances.</p></div></div><label>Adjustment reason (required)<input id="balanceReason" class="field" style="width:100%;margin-top:6px" placeholder="Example: Annual tenure credit, HR-approved carry-forward, comp-off earned"></label><div class="tablewrap" style="margin-top:16px"><table style="min-width:1200px"><thead><tr><th>Employee</th><th>Casual Leave</th><th>Maternity Leave</th>${EDITABLE_ALLOWANCES.map(t=>`<th>${t}</th>`).join('')}<th>Action</th></tr></thead><tbody>${rows}</tbody></table></div></section><section class="card" style="margin-top:16px"><div class="section-title"><div><h2>Balance adjustment history</h2><p>Latest 30 changes for all employees</p></div></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Employee</th><th>Leave type</th><th>Old</th><th>New</th><th>Changed by</th><th>Reason</th></tr></thead><tbody>${audit.map(a=>`<tr><td>${new Date(a.changedAt).toLocaleString('en-IN')}</td><td>${a.employeeName}</td><td>${a.type}</td><td>${a.oldValue}</td><td>${a.newValue}</td><td>${a.changedBy}</td><td>${a.reason}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No balance changes yet.</td></tr>'}</tbody></table></div></section>`}
function slug(t){return t.toLowerCase().replace(/[^a-z0-9]/g,'_')}
function saveEmployeeBalances(employeeId){if(state.role!=='tl')return flash('Only TLs can edit these balances.');let employee=team().find(e=>e.id===employeeId),reason=document.getElementById('balanceReason').value.trim();if(!employee)return flash('Employee is not available in the directory.');if(!reason)return flash('Enter an adjustment reason before saving.');allowances[employeeId]=allowances[employeeId]||{};let changed=0;EDITABLE_ALLOWANCES.forEach(type=>{let el=document.getElementById(`bal_${employeeId}_${slug(type)}`),next=Number(el.value),old=allowanceFor(employeeId,type);if(!Number.isFinite(next)||next<0)return;if(next!==old){allowances[employeeId][type]=next;allowanceAudit.unshift({id:Date.now()+changed,employeeId,employeeName:employee.name,type,oldValue:old,newValue:next,changedBy:me().name,changedByEmail:me().email,reason,changedAt:new Date().toISOString()});changed++}});if(!changed)return flash('No balance changes detected.');saveAllowances();flash(`${changed} balance adjustment(s) saved.`);balanceManager()}

function requestTable(){let v=visible();document.getElementById('main').innerHTML=`<section class="card"><div class="section-title"><div><h2>${state.role==='tl'?'All Employee Requests':'My requests'}</h2><p>${v.length} record(s)</p></div><div><input id="search" class="field" placeholder="Search" oninput="filterRows()"> <select id="status" class="field" onchange="filterRows()"><option>All</option><option>Draft</option><option>Pending</option><option>Approved</option><option>Rejected</option></select></div></div><div class="tablewrap"><table><thead><tr>${state.role==='tl'?'<th>Employee</th>':''}<th>Request</th><th>Dates</th><th>Days</th><th>Details</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows">${rows(v)}</tbody></table></div></section>`}
function rows(v){return v.map(x=>`<tr data-text="${(x.employeeName+' '+x.type+' '+x.reason+' '+x.status).toLowerCase()}" data-status="${x.status}">${state.role==='tl'?`<td><b>${x.employeeName}</b></td>`:''}<td>${x.type}</td><td>${pretty(x.start)}${x.end!==x.start?' – '+pretty(x.end):''}</td><td>${x.days}</td><td>${x.compWfoDate?'WFO: '+pretty(x.compWfoDate):x.wfaLocation||x.reason}</td><td><span class="badge ${x.status}">${x.status}</span></td><td>${state.role==='tl'&&x.status==='Pending'?`<button class="btn green" onclick="decide(${x.id},'Approved')">Approve</button> <button class="btn red" onclick="decide(${x.id},'Rejected')">Reject</button>`:state.role==='employee'&&['Draft','Pending'].includes(x.status)?`<button class="btn red" onclick="deleteRequest(${x.id})">Delete</button>`:'—'}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">No requests yet.</td></tr>`}
function filterRows(){let q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('status').value;document.querySelectorAll('#rows tr[data-text]').forEach(r=>r.style.display=r.dataset.text.includes(q)&&(s==='All'||r.dataset.status===s)?'':'none')}
function decide(id,status){let r=requests.find(x=>x.id===id);if(state.role!=='tl')return flash('Only a TL can approve or reject requests.');requests=requests.map(x=>x.id===id?{...x,status,repliedAt:new Date().toISOString(),actionedBy:me().name,actionedByEmail:me().email}:x);save();flash('Request '+status.toLowerCase()+' by '+me().name+'.');render()}
function deleteRequest(id){let r=requests.find(x=>x.id===id);if(!r||state.role!=='employee'||r.employeeId!==me().id)return flash('You can delete only your own request.');if(!['Draft','Pending'].includes(r.status))return flash('Approved or rejected requests cannot be deleted.');if(!confirm(`Delete this ${r.type} request for ${pretty(r.start)}${r.end!==r.start?' to '+pretty(r.end):''}? This cannot be undone.`))return;requests=requests.filter(x=>x.id!==id);save();flash('Request deleted.');render()}
function dueInfo(r){let a=age(r),last=r.lastReminderAt?Math.floor((Date.now()-new Date(r.lastReminderAt))/86400000):null,due=rules.enabled&&a>=rules.firstAfter&&(last===null||last>=rules.repeatEvery);return{a,last,due,urgent:a>=rules.urgentAfter}}
function countDue(){return state.role==='tl'?visible().filter(x=>x.status==='Pending'&&dueInfo(x).due).length:0}
function reminders(){let all=visible().filter(x=>x.status==='Pending').map(x=>({...x,...dueInfo(x)})).sort((a,b)=>Number(b.due)-Number(a.due)||b.a-a.a);document.getElementById('main').innerHTML=`<section class="grid stats">${stat('Pending requests',all.length)}${stat('Replies due now',all.filter(x=>x.due).length)}${stat('Urgent overdue',all.filter(x=>x.urgent).length)}${stat('Reminders drafted',all.reduce((s,x)=>s+(x.reminderCount||0),0))}</section><section class="card" style="margin-top:16px"><div class="section-title"><div><h2>Automatic reminder intervals</h2><p>Due status recalculates whenever the file is open or data changes.</p></div></div><div class="formgrid"><label><input type="checkbox" ${rules.enabled?'checked':''} onchange="setRule('enabled',this.checked)"> Enable reminders</label><label>First reminder after<input class="field" type="number" min="0" value="${rules.firstAfter}" onchange="setRule('firstAfter',+this.value)"> <span class="small">pending days</span></label><label>Repeat every<input class="field" type="number" min="1" value="${rules.repeatEvery}" onchange="setRule('repeatEvery',+this.value)"> <span class="small">days after last reminder</span></label><label>Mark urgent after<input class="field" type="number" min="1" value="${rules.urgentAfter}" onchange="setRule('urgentAfter',+this.value)"> <span class="small">pending days</span></label></div></section><section class="card" style="margin-top:16px;padding:0"><div class="section-title" style="padding:20px;margin:0"><div><h2>TL Reply Reminder Center</h2><p>Draft reminders open in Outlook or the configured email app.</p></div></div>${all.map(x=>`<div class="reminder ${x.due?(x.urgent?'urgent':'due'):''}"><div><b>${x.employeeName} · ${x.type}</b> ${x.due?`<span class="pill">${x.urgent?'Urgent':'Reminder due'}</span>`:''}<div class="small">${pretty(x.start)}${x.end!==x.start?' – '+pretty(x.end):''} · Pending ${x.a} day(s)</div><div class="small">Reminders drafted: ${x.reminderCount||0}${x.lastReminderAt?' · Last: '+new Date(x.lastReminderAt).toLocaleString('en-IN'):' · None yet'}</div></div><div><button class="btn" ${!x.due?'disabled':''} onclick="draftReminder(${x.id})">Draft reminder</button> <button class="btn green" onclick="decide(${x.id},'Approved')">Approve</button> <button class="btn red" onclick="decide(${x.id},'Rejected')">Reject</button></div></div>`).join('')||'<div class="empty">No pending requests.</div>'}</section>`}
function setRule(k,v){rules[k]=v;save();render()}
function draftReminder(id){let r=requests.find(x=>x.id===id),who=me(),employee=EMP.find(x=>x.id===r.employeeId),body=`Hi ${r.employeeName},\n\nThis is an update regarding your ${r.type} request for ${pretty(r.start)}${r.end!==r.start?' to '+pretty(r.end):''}. The request is still pending review and will be updated once actioned.\n\nRegards,\n${who.name}`;r.lastReminderAt=new Date().toISOString();r.reminderCount=(r.reminderCount||0)+1;save();location.href=`mailto:${employee.email}?subject=${encodeURIComponent('Update reminder: '+r.type+' request')}&body=${encodeURIComponent(body)}`}

const allAccounts=()=>[...TLS.map(x=>({...x,role:'tl'})),...EMP.map(x=>({...x,role:'employee'}))];
async function hashPassword(password,email){const data=new TextEncoder().encode(email.toLowerCase()+'|ISM145|'+password);const digest=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function credentialKey(email){return 'ism145.credential.'+email.toLowerCase()}
function populateLogin(){let sel=document.getElementById('loginEmail');sel.innerHTML='<option value="">Select your email</option>'+allAccounts().map(x=>`<option value="${x.email}">${x.name} — ${x.email}</option>`).join('');sel.onchange=updateLoginMode;updateLoginMode()}
function updateLoginMode(){let email=document.getElementById('loginEmail').value;document.getElementById('confirmWrap').classList.add('hidden');document.getElementById('loginBtn').textContent='Sign in / Create first-time account';document.getElementById('loginSubtitle').textContent=email?'Enter your tracker password. On first use, this creates the account.':'Select your registered work email.'}
async function login(){let email=document.getElementById('loginEmail').value,password=document.getElementById('loginPassword').value;if(!cloudReady)return flashLogin('Supabase configuration is missing in supabase-config.js.');if(!email)return flashLogin('Select your work email.');if(password.length<8)return flashLogin('Password must contain at least 8 characters.');try{let result=await sb.auth.signInWithPassword({email,password});if(result.error){let created=await sb.auth.signUp({email,password,options:{data:{full_name:allAccounts().find(a=>a.email.toLowerCase()===email.toLowerCase())?.name||email}}});if(created.error)return flashLogin(result.error.message||created.error.message);if(!created.data.session)return flashLogin('Account created. Confirm the email if email confirmation is enabled, then sign in.')}let account=allAccounts().find(a=>a.email.toLowerCase()===email.toLowerCase());state={...state,role:account.role,email:account.email,page:'dashboard'};await sharedLoad();document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');document.getElementById('loginPassword').value='';render()}catch(e){flashLogin('Cloud sign-in failed: '+e.message)}}
function flashLogin(t){document.getElementById('loginSubtitle').textContent=t;document.getElementById('loginSubtitle').style.color='#e11d48'}
async function logout(){if(sb)await sb.auth.signOut();state.email='';document.getElementById('appShell').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');populateLogin()}
async function changePassword(){let next=document.getElementById('newPassword').value,confirm=document.getElementById('confirmNewPassword').value;if(next.length<8)return flash('New password must contain at least 8 characters.');if(next!==confirm)return flash('New passwords do not match.');let {error}=await sb.auth.updateUser({password:next});if(error)return flash(error.message);document.getElementById('currentPassword').value='';document.getElementById('newPassword').value='';document.getElementById('confirmNewPassword').value='';flash('Password changed successfully.')}
function accountPage(){let who=me();document.getElementById('main').innerHTML=`<section class="card"><div class="section-title"><div><h2>My Account</h2><p>Signed in as ${who.name}</p></div></div><div class="route"><b>Email:</b> ${who.email}<br><b>Access:</b> ${state.role==='tl'?'Team Lead':'Employee'}${state.role==='employee'?`<br><b>Reporting TL:</b> ${TLS.find(x=>x.email.toLowerCase()===who.tl.toLowerCase()).name}`:''}</div><h3 style="margin-top:24px">Change password</h3><div class="account-grid"><label>Current password<input id="currentPassword" type="password" class="field" style="width:100%;margin-top:6px"></label><span></span><label>New password<input id="newPassword" type="password" minlength="8" class="field" style="width:100%;margin-top:6px"></label><label>Confirm new password<input id="confirmNewPassword" type="password" minlength="8" class="field" style="width:100%;margin-top:6px"></label></div><button class="btn primary" style="margin-top:16px" onclick="changePassword()">Change password</button><p class="account-note">Password credentials are managed by Supabase Auth and tracker records are stored in the shared Supabase cloud database.</p></section>`}
async function sharedLoad(){let {data,error}=await sb.rpc('get_ism145_state');if(error)throw error;let x=data?.[0];if(!x)throw new Error('Shared cloud state unavailable');sharedVersion=x.version;requests=x.data.requests||[];rules=x.data.rules||rules;allowances=x.data.allowances||{};allowanceAudit=x.data.allowanceAudit||[];tlCoverage=x.data.tlCoverage||{}}
async function sharedSave(){if(!sb)return;let data={requests,rules,allowances,allowanceAudit,tlCoverage};let {data:newVersion,error}=await sb.rpc('save_ism145_state',{expected_version:sharedVersion,new_data:data});if(error){if(String(error.message).includes('VERSION_CONFLICT')){alert('Another user updated the tracker. The latest cloud data will now reload.');await sharedLoad();render();return}flash('Cloud save failed: '+error.message);return}sharedVersion=newVersion}
async function startApp(){populateLogin();if(!cloudReady){document.getElementById('loginSubtitle').textContent='Add Supabase Project URL and Publishable key in supabase-config.js.';document.getElementById('loginSubtitle').style.color='#e11d48';return}let {data}=await sb.auth.getSession();if(data.session){let account=allAccounts().find(a=>a.email.toLowerCase()===data.session.user.email.toLowerCase());if(account){state={...state,role:account.role,email:account.email,page:'dashboard'};await sharedLoad();document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');render()}}else document.getElementById('loginSubtitle').textContent='Sign in to the shared ISM 145 cloud database.'}
startApp();

</script></div></body></html>
